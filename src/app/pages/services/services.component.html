<section class="page-hero">
  <div class="container">
    <h1>Our Services</h1>
    <p class="page-hero-sub">Expert dermatology and skin care in Nagpur—from acne and hair regrowth to skin diseases, laser therapy, and more.</p>
  </div>
</section>

<section class="services-list section">
  <div class="container">
    <div class="services-list-grid">
      @for (service of services; track service.title) {
        <div class="service-item">
          <img
            class="service-item-image"
            [src]="service.imageUrl"
            [alt]="service.imageAlt"
            loading="lazy"
            decoding="async"
          />
          <span class="service-item-icon" aria-hidden="true">{{ service.icon }}</span>
          <div class="service-item-content">
            <h3>{{ service.title }}</h3>
            <p>{{ service.description }}</p>
          </div>
        </div>
      }
    </div>
    <div class="section-cta">
      <a (click)="callForAppointment()" class="btn btn-primary">Book a Consultation</a>
    </div>
  </div>
</section>
