<section class="page-hero">
  <div class="container">
    <h1>Contact Us</h1>
    <p class="page-hero-sub">We’d love to hear from you.</p>
  </div>
</section>

<section class="contact-section section">
  <div class="container contact-layout">
    <div class="contact-form-wrapper">
      <h2>Send a Message</h2>
      @if (submitted) {
        <div class="contact-success">
          <p>Thank you. We’ll get back to you as soon as possible.</p>
        </div>
      } @else {
        <form class="contact-form" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="name">Name <span class="required">*</span></label>
            <input id="name" type="text" [(ngModel)]="model.name" name="name" required />
          </div>
          <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <input id="email" type="email" [(ngModel)]="model.email" name="email" required />
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input id="subject" type="text" [(ngModel)]="model.subject" name="subject" />
          </div>
          <div class="form-group">
            <label for="message">Message <span class="required">*</span></label>
            <textarea id="message" [(ngModel)]="model.message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-gold">Send Message</button>
        </form>
      }
    </div>
    <div class="contact-info">
      <h3>Visit Us</h3>
      <p>123 Wellness Avenue<br>City, State 12345</p>
      <h3>Call</h3>
      <p><a href="tel:+15551234567">+1 (555) 123-4567</a></p>
      <h3>Email</h3>
      <p><a href="mailto:hello&#64;laasthetic.com">hello&#64;laasthetic.com</a></p>
      <a routerLink="/book-appointment" class="btn btn-primary">Book Appointment</a>
    </div>
  </div>
</section>
